I routes","Error de tipado"],correct:1,explanation:"El mismatch ocurre cuando el HTML generado en SSR no coincide con lo que React intenta hidratar en cliente, usualmente por usar window/Date/random en render."},{id:3,category:"Frontend",question:"CSS: ¿qué hace `contain: layout`?",level:"Avanzado",options:["Crea un nuevo contexto que aísla layout y mejora performance","Centra el elemento","Oculta overflow","Activa GPU"],correct:0,explanation:"Containment le dice al navegador que este subárbol no afecta layout externo, permitiendo optimizaciones."},{id:4,category:"Frontend",question:"¿Cuál es la diferencia clave entre `useEffect` y `useLayoutEffect`?",level:"Intermedio",options:["useLayoutEffect es asíncrono","useLayoutEffect corre sincrónico después de DOM mutations y antes de paint","useEffect solo corre en servidor","No hay diferencia"],correct:1,explanation:"useLayoutEffect bloquea el paint hasta ejecutar, útil para medir DOM y evitar flicker."},{id:5,category:"Frontend",question:"Para accesibilidad, ¿qué atributo es correcto para un menú desplegable?",level:"Básico",options:["aria-hidden='true'","aria-expanded + aria-controls","role='hidden'","tabindex='-1' siempre"],correct:1,explanation:"aria-expanded comunica estado abierto/cerrado y aria-controls vincula el botón con el panel."},{id:6,category:"Frontend",question:"En Zustand/Redux, ¿qué es un selector y por qué importa?",level:"Intermedio",options:["Un CSS selector","Función que extrae slice de estado para evitar re-renders innecesarios","Un middleware","Un hook de servidor"],correct:1,explanation:"Selectores bien granulares reducen suscripciones y renders, clave para perf en apps grandes."},{id:7,category:"Frontend",question:"¿Qué estrategia evita CLS (Cumulative Layout Shift)?",level:"Intermedio",options:["Cargar fuentes sin display swap","Reservar width/height en imágenes y skeletons","Usar position: fixed en todo","Desactivar lazy loading"],correct:1,explanation:"Reservar espacio evita que contenido salte cuando carga, mejorando Core Web Vitals."},{id:8,category:"Frontend",question:"¿Cuándo usar `React Server Components`?",level:"Avanzado",options:["Para interactividad con estado","Para data fetching y render pesado sin JS en cliente","Para animaciones","Nunca"],correct:1,explanation:"RSC permiten traer datos cerca del origen y enviar solo HTML, cero JS para partes estáticas."},{id:9,category:"Frontend",question:"¿Qué hace `view-transition-name`?",level:"Avanzado",options:["Crea animaciones fluidas entre estados de página con View Transitions API","Renombra componentes","Cambia SEO title","Nada en React"],correct:0,explanation:"View Transitions API permite transiciones nativas tipo app entre vistas asignando nombres compartidos."},{id:10,category:"Frontend",question:"Web Vitals: INP mide...",level:"Intermedio",options:["Tiempo de primer byte","Latencia de todas las interacciones hasta respuesta visual","Tamaño del bundle","Tiempo de carga de imágenes"],correct:1,explanation:"Interaction to Next Paint reemplazó FID, mide reactividad real durante toda la sesión."},{id:11,category:"Backend",question:"En Node.js, ¿por qué el Event Loop puede bloquearse?",level:"Intermedio",options:["Por usar muchas Promesas","Por tareas síncronas CPU-intensivas en el hilo principal","Por usar fetch","Por usar cluster"],correct:1,explanation:"Node es single-threaded para JS; JSON.parse gigante, crypto sync o bucles bloquean el loop."},{id:12,category:"Backend",question:"¿Qué patrón evita N+1 queries en una API?",level:"Intermedio",options:["Dataloader / eager loading / batching","Más cachés","Más microservicios","Usar REST en vez de GraphQL"],correct:0,explanation:"Agrupar peticiones relacionadas con DataLoader o JOIN/incluidos evita N consultas extra."},{id:13,category:"Backend",question:"Idempotencia en REST: ¿qué método DEBE ser idempotente?",level:"Básico",options:["POST","PUT y DELETE","PATCH siempre","Ninguno"],correct:1,explanation:"Repetir PUT/DELETE debe dar mismo estado en servidor, POST no garantiza eso."},{id:14,category:"Backend",question:"¿Cuándo conviene usar cola de mensajes (SQS, RabbitMQ)?",level:"Intermedio",options:["Para respuestas síncronas rápidas","Para tareas asíncronas, reintentos y desacoplar servicios","Para cache","Para auth"],correct:1,explanation:"Las colas absorben picos, permiten retry y separan responsabilidades."},{id:15,category:"Backend",question:"¿Qué hace `SELECT ... FOR UPDATE` en transacciones?",level:"Avanzado",options:["Lee sin bloquear","Bloquea filas seleccionadas para evitar race conditions","Hace backup","Acelera query"],correct:1,explanation:"Es lock pesimista, esencial en inventario, wallets o reservas."},{id:16,category:"Backend",question:"Rate limiting con Token Bucket vs Fixed Window:",level:"Avanzado",options:["Bucket permite bursts controlados, Fixed Window puede tener picos dobles en el borde","Son iguales","Bucket es solo para frontend","Fixed Window es más justo"],correct:0,explanation:"Fixed Window sufre edge overflow; token bucket suaviza ráfagas manteniendo rate promedio."},{id:17,category:"Backend",question:"¿Qué ventaja tiene cursor pagination sobre offset?",level:"Intermedio",options:["Es más simple","Estable con datos cambiantes y más eficiente en DB grandes","Permite saltar a página 1000 más rápido","No necesita índice"],correct:1,explanation:"Offset escanea y salta filas; cursor usa índice y evita duplicados/saltos si insertan."},{id:18,category:"Backend",question:"En NestJS/Express, ¿dónde validar entrada del usuario?",level:"Básico",options:["Solo en frontend","En DTOs / middlewares de validación en el edge de la API","En la base de datos","Nunca"],correct:1,explanation:"Validar al borde con zod/class-validator evita basura y ataques antes de lógica."},{id:19,category:"Backend",question:"¿Qué es backpressure en streams?",level:"Avanzado",options:["Error de base de datos","Mecanismo donde consumidor lento le dice al productor que pause","Un tipo de cache","Latency de red"],correct:1,explanation:"Sin backpressure, memoria explota al acumular datos que nadie consume."},{id:20,category:"Backend",question:"JWT: ¿por qué no guardar información sensible en el payload?",level:"Básico",options:["Porque expira","Porque es solo base64, legible por cualquiera","Porque es muy grande","Porque no se puede revocar"],correct:1,explanation:"JWT no está cifrado por defecto, solo firmado. Cualquiera puede decodificarlo."},{id:21,category:"Base de Datos",question:"¿Qué resuelve un índice compuesto (a,b) vs dos índices separados?",level:"Intermedio",options:["Nada, igual performance","Optimiza queries que filtran por a y a+b en orden","Solo ayuda a COUNT","Solo para primary key"],correct:1,explanation:"El orden importa: (a,b) sirve para WHERE a= y WHERE a= AND b=, pero no solo b."},{id:22,category:"Base de Datos",question:"Isolation level 'Read Committed' evita:",level:"Avanzado",options:["Dirty reads","Phantom reads","Lost updates en app","Todo"],correct:0,explanation:"Evita leer datos no confirmados, pero aún permite non-repeatable y phantoms según motor."},{id:23,category:"Base de Datos",question:"En Postgres, ¿qué es TOAST?",level:"Avanzado",options:["Mecanismo para guardar valores grandes fuera de la fila principal","Un tipo de índice","Un backup","Un trigger"],correct:0,explanation:"The Oversized-Attribute Storage Technique fragmenta textos/JSON grandes."},{id:24,category:"Base de Datos",question:"¿Cuándo usar Redis en vez de Postgres para una feature?",level:"Intermedio",options:["Para transacciones complejas","Para cache, sesiones, rate limit, pub/sub con expiración","Para reportes SQL","Siempre"],correct:1,explanation:"Redis es in-memory, estructuras de datos rápidas y TTL nativo."},{id:25,category:"Base de Datos",question:"¿Qué es una migración idempotente?",level:"Básico",options:["Que se puede correr varias veces sin romper","Que nunca cambia","Que solo baja","Que borra datos"],correct:0,explanation:"Usar IF NOT EXISTS, transacciones y checks hace migraciones seguras en CI."},{id:26,category:"Base de Datos",question:"Explica `EXPLAIN ANALYZE`:",level:"Intermedio",options:["Muestra plan + ejecuta realmente midiendo tiempos","Solo estima","Crea índice","Optimiza auto"],correct:0,explanation:"ANALYZE ejecuta y mide, cuidado en prod porque puede ser pesado."},{id:27,category:"Base de Datos",question:"¿Qué problema mitiga el patrón Outbox?",level:"Avanzado",options:["Doble escritura inconsistente entre DB y broker de eventos","Lentitud de SELECT","Falta de índices","Sharding"],correct:0,explanation:"Escribe evento en misma transacción que negocio, luego un relay publica, garantizando eventual consistency."},{id:28,category:"Base de Datos",question:"En MongoDB, ¿por qué evitar documentos embebidos gigantes?",level:"Intermedio",options:["Límite de 16MB y costo de mover documento en disco","No se pueden indexar","No se pueden actualizar","Son inseguros"],correct:0,explanation:"Documentos grandes causan reubicación, overhead de RAM y superan límite."},{id:29,category:"Base de Datos",question:"¿Qué es normalización vs desnormalización?",level:"Básico",options:["Normalizar reduce redundancia, desnormalizar duplica para lectura rápida","Son lo mismo","Solo para NoSQL","Solo para logs"],correct:0,explanation:"Tradeoff clásico: integridad vs performance de lectura."},{id:30,category:"Base de Datos",question:"¿Cuándo usar `SERIALIZABLE`?",level:"Avanzado",options:["Siempre","Cuando necesitas máxima consistencia y puedes pagar reintentos por conflictos","Para logs","Nunca"],correct:1,explanation:"Serialización evita anomalías pero aborta transacciones concurrentes, requiere retry lógica."},{id:31,category:"Arquitectura",question:"Monolito modular vs microservicios: ¿cuándo elegir monolito?",level:"Intermedio",options:["Equipo pequeño, dominio poco claro, deploy simple","Siempre microservicios","Cuando hay 100 devs","Para escalar base de datos"],correct:0,explanation:"Monolito bien modularizado es más simple hasta Product-Market Fit; microservicios tienen costo operacional."},{id:32,category:"Arquitectura",question:"¿Qué aporta un API Gateway?",level:"Básico",options:["Solo ruteo","Auth, rate limit, agregación, observabilidad centralizada","Base de datos","Frontend"],correct:1,explanation:"Gateway es fachada que corta concerns transversales."},{id:33,category:"Arquitectura",question:"CQRS significa:",level:"Intermedio",options:["Separar modelos de lectura y escritura","Cache Query Result Set","Un tipo de base de datos","Un protocolo"],correct:0,explanation:"Optimiza lectura y escritura por separado, útil con Event Sourcing."},{id:34,category:"Arquitectura",question:"¿Qué es Event Sourcing?",level:"Avanzado",options:["Guardar estado actual","Guardar secuencia de eventos inmutables y derivar estado","Enviar emails","Usar Kafka obligatorio"],correct:1,explanation:"Auditoría completa y replay, pero complejidad de proyecciones y versionado."},{id:35,category:"Arquitectura",question:"Teorema CAP: en partición de red, debes elegir entre:",level:"Intermedio",options:["Consistencia o Disponibilidad","Velocidad o Memoria","SQL o NoSQL","Cache o DB"],correct:0,explanation:"En P, solo puedes garantizar C o A, no ambas."},{id:36,category:"Arquitectura",question:"¿Para qué sirve un Circuit Breaker?",level:"Intermedio",options:["Evitar cascada de fallos abriendo el circuito cuando downstream falla","Aumentar timeout","Balancear carga","Cifrar datos"],correct:0,explanation:"Patrón de resiliencia: fail fast y da tiempo a recuperarse al servicio fallido."},{id:37,category:"Arquitectura",question:"Hexagonal / Ports & Adapters busca:",level:"Avanzado",options:["Desacoplar dominio de frameworks e IO","Más microservicios","Más rápido","Usar GraphQL"],correct:0,explanation:"El núcleo no conoce DB ni framework, todo entra por puertos, testeable."},{id:38,category:"Arquitectura",question:"¿Qué es back-of-the-envelope para 1M DAU?",level:"Avanzado",options:["Calcular QPS, storage, cache, bandwidth aproximado","Diseñar UI","Escribir código","Ignorar números"],correct:0,explanation:"Estimación rápida guía decisiones de infraestructura y cuellos de botella."},{id:39,category:"Arquitectura",question:"Idempotency Key en pagos:",level:"Intermedio",options:["Clave que evita doble cobro si cliente reintenta","Clave de API","JWT","Hash de password"],correct:0,explanation:"Server guarda key y respuesta; reintento retorna mismo resultado sin efecto secundario."},{id:40,category:"Arquitectura",question:"¿Cuándo usar WebSockets vs SSE?",level:"Intermedio",options:["WS bidireccional juegos/chat, SSE unidireccional para notificaciones simples sobre HTTP","Siempre WS","Siempre SSE","Ninguno para prod"],correct:0,explanation:"SSE es más simple y reconecta solo, WS necesario para duplex real."},{id:41,category:"DevOps",question:"Docker: ¿por qué multi-stage build?",level:"Intermedio",options:["Para tener imagen final pequeña sin herramientas de build","Para correr más rápido","Para tener más capas","Para usar más RAM"],correct:0,explanation:"Separar stage de compilación y runtime reduce superficie de ataque y tamaño."},{id:42,category:"DevOps",question:"En Kubernetes, ¿qué hace HPA?",level:"Básico",options:["Escala pods según métricas CPU/memoria/custom","Hace backup","Hace deploy","Monitorea logs"],correct:0,explanation:"Horizontal Pod Autoscaler ajusta réplicas automáticamente."},{id:43,category:"DevOps",question:"¿Qué es infra inmutable?",level:"Intermedio",options:["No cambiar servidores en sitio, reemplazar con nueva versión","No usar terraform","Editar a mano","Usar FTP"],correct:0,explanation:"Evita drift, deploy reproducible y rollback fácil."},{id:44,category:"DevOps",question:"12-Factor App: ¿dónde va la config?",level:"Básico",options:["En código","En variables de entorno","En README","En base de datos"],correct:1,explanation:"Env vars separan config de código y permiten mismos artefactos en varios entornos."},{id:45,category:"DevOps",question:"¿Qué aporta OpenTelemetry?",level:"Intermedio",options:["Estándar vendor-neutral para traces, metrics y logs correlacionados","Solo logging","Solo métricas","Solo para AWS"],correct:0,explanation:"Telemetría unificada para observabilidad distribuida."},{id:46,category:"DevOps",question:"Blue/Green vs Canary deploy:",level:"Intermedio",options:["Blue/Green cambia todo de golpe con rollback rápido, Canary libera progresivo a % usuarios","Son iguales","Canary es más riesgoso","Blue/Green no permite rollback"],correct:0,explanation:"Canary detecta errores con subset real de tráfico."},{id:47,category:"DevOps",question:"Terraform state remoto ¿por qué?",level:"Intermedio",options:["Para compartir bloqueo y evitar corrupción con equipo","Para ser más rápido","Para no usar git","No se usa"],correct:0,explanation:"Backend S3 + DynamoDB lock evita concurrencia y drift."},{id:48,category:"DevOps",question:"¿Qué mide SLO vs SLI vs SLA?",level:"Avanzado",options:["SLI es métrica, SLO objetivo interno, SLA contrato con cliente","Todos iguales","SLO es métrica","SLA es interno"],correct:0,explanation:"SLI 99.9% latencia, SLO 99.9%, SLA 99.5% con penalización."},{id:49,category:"DevOps",question:"En CI, ¿qué hace cache de dependencias correctamente invalidado?",level:"Básico",options:["Acelera builds sin falsos positivos","Rompe builds","No sirve","Solo para Docker"],correct:0,explanation:"Key por lockfile asegura cache hit seguro."},{id:50,category:"DevOps",question:"¿Por qué distroless images?",level:"Avanzado",options:["Menor superficie de ataque y menor tamaño, sin shell","Más rápido de compilar","Tienen más herramientas","Para debug"],correct:0,explanation:"Sin shell/package manager, explotar RCE es más difícil."},{id:51,category:"Seguridad",question:"¿Cómo mitigar XSS almacenado?",level:"Intermedio",options:["Sanitizar input + escapar output según contexto + CSP","Solo validar email","Usar HTTP","Desactivar JS"],correct:0,explanation:"Defense in depth: validación, encoding por contexto HTML/JS/URL y CSP con nonce."},{id:52,category:"Seguridad",question:"CSRF se previene con:",level:"Intermedio",options:["SameSite cookies + token anti-CSRF para acciones mutantes","CORS abierto","JWT en localStorage","GET para todo"],correct:0,explanation:"SameSite Lax/Strict + token sincronizador corta request forjado."},{id:53,category:"Seguridad",question:"¿Qué header evita clickjacking?",level:"Básico",options:["X-Frame-Options DENY / CSP frame-ancestors","X-Powered-By","Server","Age"],correct:0,explanation:"Evita que tu sitio sea embebido en iframe malicioso."},{id:54,category:"Seguridad",question:"Bcrypt vs SHA256 para passwords:",level:"Básico",options:["Bcrypt es lento y con salt, SHA256 rápido y no sirve solo","SHA mejor","Son iguales","Bcrypt no usa salt"],correct:0,explanation:"Password hashing debe ser intencionalmente lento y con salt único."},{id:55,category:"Seguridad",question:"¿Qué es SSRF?",level:"Avanzado",options:["Server hace request a recurso interno controlado por atacante","Cliente hace XSS","Falta de TLS","SQL injection"],correct:0,explanation:"Atacante engaña al backend para que llame a metadata service o red interna."},{id:56,category:"Seguridad",question:"OAuth2: ¿por qué PKCE en SPA?",level:"Intermedio",options:["Evita interceptación de code en clientes públicos sin secret","Más rápido","Reemplaza JWT","No se usa"],correct:0,explanation:"Code_challenge/verifier asegura que quien canjea code es quien inició flow."},{id:57,category:"Seguridad",question:"Secrets management correcto:",level:"Intermedio",options:["Commitear .env","Vault / Secrets Manager con rotación y mínimo privilegio","En localStorage","En código"],correct:1,explanation:"Nunca en repo; inyección en runtime con auditoría."},{id:58,category:"Seguridad",question:"¿Qué hace `Strict-Transport-Security`?",level:"Básico",options:["Fuerza HTTPS y evita downgrade","Comprime","Cachea","Evita XSS"],correct:0,explanation:"HSTS le dice al browser no intentar HTTP por tiempo definido."},{id:59,category:"Seguridad",question:"Rate limiting en login mitiga:",level:"Básico",options:["Brute force y credential stuffing","XSS","SQLi","CSRF"],correct:0,explanation:"Limitar intentos + captcha adaptativo + monitoreo de IPs."},{id:60,category:"Seguridad",question:"¿Qué es principio de mínimo privilegio en IAM?",level:"Intermedio",options:["Dar solo permisos necesarios por tiempo mínimo","Dar admin a todos","No usar roles","Dar lectura total"],correct:0,explanation:"Reduce blast radius si credencial se filtra."}
,{id:61,category:"Frontend",question:"En React, ¿qué resuelve useActionState con Server Actions?",level:"Intermedio",options:["Expone el estado de la acción, el error y el pending sin useState manual","Reemplaza por completo a useEffect","Hace fetch automático al montar","Sincroniza el estado con localStorage"],correct:0,explanation:"useActionState agrupa el resultado de la acción, el estado de error y el flag de pending, evitando manejar esos tres estados a mano."}
,{id:62,category:"Frontend",question:"CSS: ¿qué hace will-change: transform antes de una animación?",level:"Avanzado",options:["Crea una capa de composición para evitar repaints costosos","Aplica una transición automática de 300 ms","Garantiza 60 fps sin coste de memoria","Bloquea el layout del elemento"],correct:0,explanation:"Promueve el elemento a su propia capa para que el navegador la prepare; abusar de ella consume memoria y puede empeorar el rendimiento."}
,{id:63,category:"Frontend",question:"¿Qué mide la métrica INP (Interaction to Next Paint)?",level:"Intermedio",options:["El tiempo total de carga inicial","La latencia desde una interacción hasta el siguiente frame visible","El número de long tasks de la página","El peso del bundle de JavaScript"],correct:1,explanation:"INP mide la respuesta percibida a las interacciones del usuario y sustituyó a FID como métrica Core Web Vitals."}
,{id:64,category:"Frontend",question:"En TypeScript, ¿qué diferencia hay entre unknown y any?",level:"Básico",options:["Ninguna, son alias","unknown obliga a estrechar el tipo antes de usarlo; any desactiva el chequeo","any solo existe en modo estricto","unknown sirve únicamente para genéricos"],correct:1,explanation:"unknown es seguro porque exige una comprobación previa; any propaga la ausencia de tipos y oculta errores."}
,{id:65,category:"Frontend",question:"¿Para qué sirve un AbortController en una petición fetch?",level:"Intermedio",options:["Para reintentar la petición automáticamente","Para cancelar la petición y liberar sus recursos","Para comprimir la respuesta","Para cachear la respuesta en disco"],correct:1,explanation:"Su signal permite abortar la petición, clave al desmontar componentes o al escribir en un buscador con debounce."}
,{id:66,category:"Backend",question:"En Node.js, ¿por qué el event loop atiende muchas conexiones con pocos hilos?",level:"Intermedio",options:["Porque usa un hilo por petición","Porque las operaciones de E/S se delegan y se retoman con callbacks","Porque compila el código a WebAssembly","Porque reparte el trabajo entre el sistema operativo y la GPU"],correct:1,explanation:"Node delega la E/S al sistema y sigue atendiendo el hilo principal; por eso el trabajo intensivo de CPU bloquea todo."}
,{id:67,category:"Backend",question:"¿Qué problema resuelve el patrón outbox?",level:"Avanzado",options:["Duplicar los logs de aplicación","Publicar eventos de forma atómica junto con la transacción de base de datos","Balancear la carga entre réplicas","Versionar los endpoints de la API"],correct:1,explanation:"Se escribe el evento en una tabla dentro de la misma transacción y un proceso lo publica después, evitando perder mensajes."}
,{id:68,category:"Backend",question:"¿Qué implica que un JWT sea stateless?",level:"Intermedio",options:["Que el servidor guarda la sesión en Redis","Que el token lleva la información y no hace falta consultar una sesión en el servidor","Que no se puede revocar nunca","Que caduca en cada petición"],correct:1,explanation:"No hay estado de sesión en el servidor; el precio es que revocar un token antes de su expiración requiere listas de revocación o tokens cortos."}
,{id:69,category:"Backend",question:"¿Para qué sirve el header Idempotency-Key en una API de pagos?",level:"Avanzado",options:["Para identificar al usuario","Para repetir la petición sin duplicar el cobro","Para cifrar el cuerpo de la petición","Para limitar el rate limit por IP"],correct:1,explanation:"El servidor guarda la clave y devuelve la misma respuesta ante reintentos, evitando cargos duplicados por timeouts de red."}
,{id:70,category:"Backend",question:"En Express, ¿qué determina el orden de los middlewares?",level:"Básico",options:["Se ejecutan en orden aleatorio","Se ejecutan en el orden en que se registran, así que la autenticación va antes que las rutas","Solo se ejecuta el último registrado","Se ejecutan siempre en paralelo"],correct:1,explanation:"La cadena es secuencial; si auth se registra después de las rutas, las rutas responden sin pasar por ella."}
,{id:71,category:"Base de Datos",question:"¿Qué garantiza el nivel de aislamiento SERIALIZABLE?",level:"Avanzado",options:["Que las lecturas nunca ven datos sin confirmar","Que el resultado equivale a ejecutar las transacciones una tras otra","Que solo se bloquean las escrituras","Que se permiten lecturas fantasma"],correct:1,explanation:"Es el nivel más estricto: elimina lecturas sucias, no repetibles y fantasma, a costa de más bloqueos o abortos."}
,{id:72,category:"Base de Datos",question:"En PostgreSQL, ¿qué es un índice parcial?",level:"Intermedio",options:["Un índice que cubre la mitad de la tabla","Un índice que solo indexa las filas que cumplen una condición WHERE","Un índice corrupto que hay que reconstruir","Un índice de solo lectura"],correct:1,explanation:"Indexar solo el subconjunto relevante (por ejemplo pedidos no enviados) lo hace más pequeño y rápido de mantener."}
,{id:73,category:"Base de Datos",question:"¿Para qué tipo de consultas conviene un índice GIN?",level:"Avanzado",options:["Igualdad sobre enteros","Búsquedas dentro de arrays, JSONB y texto completo","Ordenar por fecha descendente","Unir tres tablas por clave foránea"],correct:1,explanation:"GIN indexa múltiples valores por fila, ideal para contención en arrays, claves de JSONB y tsvector."}
,{id:74,category:"Base de Datos",question:"¿Qué elimina la tercera forma normal (3FN)?",level:"Intermedio",options:["Los índices redundantes","Las dependencias transitivas entre atributos no clave","Las claves foráneas","Las vistas materializadas"],correct:1,explanation:"Cada atributo no clave debe depender solo de la clave; si depende de otro atributo no clave, se separa en otra tabla."}
,{id:75,category:"Base de Datos",question:"¿Qué aporta EXPLAIN ANALYZE frente a EXPLAIN?",level:"Básico",options:["Nada, son equivalentes","Ejecuta la consulta y muestra tiempos y filas reales","Solo muestra el plan estimado por el optimizador","Comprime la tabla antes de consultar"],correct:1,explanation:"EXPLAIN ANALYZE mide la ejecución real, revelando estimaciones erróneas del optimizador y cuellos de botella."}
,{id:76,category:"Arquitectura",question:"¿Qué caracteriza a la arquitectura hexagonal?",level:"Intermedio",options:["Concentrar todo en un único archivo","Aislar el dominio del transporte y la persistencia mediante puertos y adaptadores","Obligar a usar microservicios","Aplicarse solo al frontend"],correct:1,explanation:"El dominio no conoce HTTP ni la base de datos; se conecta a través de interfaces, lo que facilita testear y cambiar infraestructura."}
,{id:77,category:"Arquitectura",question:"¿Qué afirma el teorema CAP ante una partición de red?",level:"Avanzado",options:["Que hay que elegir entre consistencia y disponibilidad","Que siempre se pueden garantizar las tres propiedades","Que la latencia crece linealmente","Que los datos se replican solos"],correct:0,explanation:"Cuando hay partición no se puede tener consistencia y disponibilidad a la vez; los sistemas reales se sitúan entre CP y AP."}
,{id:78,category:"Arquitectura",question:"En event sourcing, ¿cuál es la fuente de verdad?",level:"Avanzado",options:["El estado actual de la entidad","La secuencia de eventos ocurridos","Solo los snapshots periódicos","Los índices de búsqueda"],correct:1,explanation:"El estado se reconstruye reproduciendo eventos; los snapshots son solo optimizaciones de lectura."}
,{id:79,category:"Arquitectura",question:"¿Qué evita el patrón circuit breaker?",level:"Intermedio",options:["Fallos en cascada cuando una dependencia responde lenta o falla","La latencia de red entre servicios","Los errores de sintaxis en el código","El acoplamiento entre tablas"],correct:0,explanation:"Al abrir el circuito deja de llamar a la dependencia caída y falla rápido, protegiendo recursos y dando tiempo a recuperarse."}
,{id:80,category:"Arquitectura",question:"¿Cuál es la función principal de una API gateway?",level:"Básico",options:["Compilar el frontend","Ser punto único de entrada con autenticación, rate limiting y enrutado","Almacenar la base de datos principal","Generar los estilos de la aplicación"],correct:1,explanation:"Centraliza preocupaciones transversales para que cada servicio no las reimplemente."}
,{id:81,category:"DevOps",question:"¿Qué diferencia hay entre rolling update y blue/green?",level:"Intermedio",options:["Son la misma estrategia con otro nombre","Rolling reemplaza instancias gradualmente; blue/green cambia el tráfico entre dos entornos completos","Rolling exige dos clusters separados","Blue/green no permite volver atrás"],correct:1,explanation:"Rolling convive versiones durante el despliegue; blue/green mantiene dos entornos y conmuta el tráfico, con rollback inmediato."}
,{id:82,category:"DevOps",question:"¿Qué ventaja da desplegar una imagen Docker por digest en vez de por tag?",level:"Avanzado",options:["Que pesa menos","Inmutabilidad: garantiza exactamente el mismo contenido siempre","Que se comprime mejor","Que funciona en cualquier arquitectura"],correct:1,explanation:"Los tags son mutables y pueden apuntar a otra imagen; el digest identifica el contenido de forma criptográfica."}
,{id:83,category:"DevOps",question:"En Kubernetes, ¿qué indica un readinessProbe?",level:"Básico",options:["Que el contenedor debe reiniciarse","Que el pod está listo para recibir tráfico","Que hay que escalar el cluster","Que se montó el volumen"],correct:1,explanation:"Si falla, el pod sale de los endpoints del Service pero no se reinicia; para eso existe el livenessProbe."}
,{id:84,category:"DevOps",question:"¿Qué significa infraestructura inmutable?",level:"Intermedio",options:["Que no se puede versionar","Que los servidores se reemplazan en lugar de modificarse en caliente","Que solo aplica a serverless","Que está prohibido actualizar imágenes"],correct:1,explanation:"Se construye una imagen nueva y se sustituye la instancia, evitando la deriva de configuración entre entornos."}
,{id:85,category:"DevOps",question:"¿Qué mide la métrica DORA lead time for changes?",level:"Intermedio",options:["El tiempo desde el commit hasta que el cambio está en producción","El tiempo de compilación del proyecto","El número de despliegues por día","Los errores detectados por despliegue"],correct:0,explanation:"Mide la agilidad del flujo commit a producción; junto a frecuencia de despliegue, MTTR y tasa de fallos forma las cuatro métricas DORA."}
,{id:86,category:"Seguridad",question:"¿Qué ataque previene comparar tokens en tiempo constante?",level:"Avanzado",options:["Inyección SQL","Ataques de temporización (timing attacks)","XSS reflejado","CSRF"],correct:1,explanation:"Una comparación que corta en el primer byte distinto filtra información por el tiempo de respuesta y permite reconstruir el secreto."}
,{id:87,category:"Seguridad",question:"¿Para qué sirve SameSite=Strict en una cookie de sesión?",level:"Intermedio",options:["Para cifrar el contenido de la cookie","Para que el navegador no la envíe en peticiones iniciadas desde otro sitio","Para aumentar su tamaño máximo","Para hacerla persistente entre reinicios"],correct:1,explanation:"Mitiga CSRF porque la cookie no viaja en navegaciones cross-site; SameSite=Lax es el equilibrio habitual."}
,{id:88,category:"Seguridad",question:"¿Qué es una Content Security Policy (CSP)?",level:"Básico",options:["Un algoritmo de cifrado de tráfico","Una cabecera que restringe qué scripts y recursos puede cargar la página","Un tipo de token JWT","Un firewall a nivel de red"],correct:1,explanation:"Declara orígenes permitidos para scripts, estilos e imágenes, reduciendo el impacto de un XSS."}
,{id:89,category:"Seguridad",question:"En OAuth 2.0, ¿qué protege PKCE?",level:"Avanzado",options:["Cifra el refresh token en reposo","El flujo authorization code en clientes públicos frente a la interceptación del code","Firma el ID token del usuario","Rota las claves del servidor"],correct:1,explanation:"El cliente envía un code_verifier cuyo hash viajó en la autorización; un code interceptado no sirve sin ese valor."}
,{id:90,category:"Seguridad",question:"¿Qué diferencia hay entre hashing y cifrado?",level:"Básico",options:["Son sinónimos","El hash es irreversible; el cifrado se revierte con la clave","El cifrado es irreversible y el hash no","El hash usa clave pública y el cifrado no"],correct:1,explanation:"Las contraseñas se guardan con hash lento y sal (bcrypt, argon2); el cifrado se usa cuando hay que recuperar el dato original."}],au=["Frontend","Backend","Base de Datos","Arquitectura","DevOps","Seguridad"];function cu(){let[e,n]=W.useState(()=>[...Au].sort(()=>0.5-Math.random()).slice(0,60)),[t,r]=W.useState(0),[o,l]=W.useState({}),[i,u]=W.useState({}),[A,s]=W.useState(""),[d,g]=W.useState("Todas"),[f,S]=W.useState(!1),[B,y]=W.useState(0),[N,c]=W.useState(!1),[a,p]=W.useState({x:50,y:50}),K=W.useRef(null);W.useEffect(()=>{if(!f||N)return;let F=setInterval(()=>y((v)=>v+1),1000);return()=>clearInterval(F)},[f,N]),W.useEffect(()=>{let F=(v)=>{p({x:v.clientX/window.innerWidth*100,y:v.clientY/window.innerHeight*100})};return window.addEventListener("mousemove",F),()=>window.removeEventListener("mousemove",F)},[]);let R=W.useMemo(()=>{let F=[...Au];if(d!=="Todas")F=F.filter((v)=>v.category===d);if(A.trim()){let v=A.toLowerCase();F=F.filter((D)=>D.question.toLowerCase().includes(v)||D.category.toLowerCase().includes(v)||D.explanation.toLowerCase().includes(v))}return F},[d,A]);W.useEffect(()=>{n(R),r(0)},[R]);let k=()=>{n(R),r(0),l({}),u({}),c(!1),y(0)},Q=()=>{let F=[...e].sort(()=>Math.random()-0.5);n(F),r(0)},O=(F,v)=>{if(o[F]!==void 0)return;l((D)=>({...D,[F]:v})),u((D)=>({...D,[F]:!0}))},H=W.useMemo(()=>{let F=0;return e.forEach((v)=>{if(o[v.id]===v.correct)F++}),F},[o,e]),P=(t+1)/e.length*100,Ce=Object.keys(o).length,ce=e[t],su=()=>c(!0),pu=()=>{n([...Au].sort(()=>Math.random()-0.5)),r(0),l({}),u({}),c(!1),y(0),g("Todas"),s("")},fu=(F)=>{let v=Math.floor(F/60).toString().padStart(2,"0"),D=(F%60).toString().padStart(2,"0");return`${v}:${D}`},dr=W.useMemo(()=>{let F={};return
